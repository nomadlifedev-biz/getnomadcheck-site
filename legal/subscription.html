<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscription — Nomad Check</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #FAF9F7; color: #2A2A2A; font-size: 16px; line-height: 1.65;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .container { width: calc(100% - 40px); max-width: 768px; margin: 0 auto; }
  header.site { display: flex; justify-content: space-between; align-items: center;
         padding: 20px 0; border-bottom: 1px solid #E4DFD9; }
  header.site .brand { font-size: 16px; font-weight: 700; color: #2F6B5E; text-decoration: none; }
  header.site .nav-legal { font-size: 14px; font-weight: 500; color: #2F6B5E; text-decoration: none; }
  header.site .nav-legal[aria-current="page"] { text-decoration: underline; }
  nav.crumb { margin-top: 16px; font-size: 0.95rem; }
  nav.crumb a { color: #2F6B5E; }
  main { padding-top: clamp(32px, 5vw, 48px); padding-bottom: 48px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(32px, 5vw, 40px);
       font-weight: 400; line-height: 1.18; letter-spacing: -0.02em; color: #2A2A2A; margin: 0 0 16px; }
  h2 { font-size: 1.2rem; line-height: 1.35; font-weight: 700; color: #2F6B5E; margin: 1.7em 0 0.5em; }
  h3 { font-size: 1.02rem; font-weight: 700; color: #2F6B5E; margin: 1.3em 0 0.4em; }
  p.lede { color: #5B615D; margin: 0 0 12px; }
  ul, ol { padding-left: 1.4em; }
  li { margin: 0.35em 0; }
  table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 0.92rem; }
  th, td { border: 1px solid #E4DFD9; padding: 10px; text-align: left; vertical-align: top; }
  th { background: #F0EBE3; }
  a { color: #2F6B5E; text-decoration: underline; }
  .cards { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
  a.card { display: flex; justify-content: space-between; align-items: center; gap: 16px;
       padding: 18px 20px; background: #FFFFFF; border: 1px solid #E4DFD9; border-radius: 16px;
       text-decoration: none; }
  a.card .t { font-size: 16px; font-weight: 600; color: #2A2A2A; }
  a.card .d { margin-top: 6px; font-size: 14px; line-height: 1.55; color: #5B615D; }
  a.card .chev { font-family: Arial, sans-serif; font-size: 24px; color: #2F6B5E; flex-shrink: 0; }
  footer.site { margin-top: 48px; padding: 24px 0 32px; border-top: 1px solid #E4DFD9;
       font-size: 14px; line-height: 1.6; }
  footer.site nav { display: flex; flex-wrap: wrap; column-gap: 20px; row-gap: 12px; }
  footer.site a { color: #2F6B5E; text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<div class="container">
<header class="site"><a class="brand" href="/">Nomad Check</a><a class="nav-legal" href="/legal/">Legal</a></header>
<nav class="crumb"><a href="/legal/">&larr; All legal pages</a></nav>
<main>
<h1>Subscription</h1>
<p>Nomad Check is currently free of charge, and no paid features are offered at this time. This page will be updated before any paid subscription is introduced.</p>
</main>
</div>
</body>
</html>
